<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ISHOPINX mobile game support and developer information.">
  <title>ISHOPINX | Miner Rush</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b1020;
      color: #f5f7ff;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 20% 15%, rgba(245, 158, 11, .20), transparent 30%),
        radial-gradient(circle at 85% 80%, rgba(59, 130, 246, .18), transparent 35%),
        #0b1020;
    }
    main {
      width: min(720px, 100%);
      padding: clamp(28px, 6vw, 56px);
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 24px;
      background: rgba(15, 23, 42, .86);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .35);
    }
    .eyebrow {
      margin: 0 0 12px;
      color: #fbbf24;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(36px, 8vw, 68px);
      line-height: 1;
      letter-spacing: -.045em;
    }
    h2 {
      margin: 14px 0 0;
      color: #cbd5e1;
      font-size: clamp(20px, 4vw, 28px);
      font-weight: 600;
    }
    p {
      max-width: 58ch;
      margin: 24px 0 0;
      color: #aebbd0;
      font-size: 17px;
      line-height: 1.7;
    }
    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 32px;
    }
    a {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 0 18px;
      border: 1px solid rgba(255, 255, 255, .16);
      border-radius: 999px;
      color: #f8fafc;
      font-weight: 700;
      text-decoration: none;
      transition: border-color .2s ease, background .2s ease, transform .2s ease;
    }
    a:hover, a:focus-visible {
      border-color: #fbbf24;
      background: rgba(251, 191, 36, .10);
      transform: translateY(-1px);
      outline: none;
    }
    footer {
      margin-top: 36px;
      color: #64748b;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">ISHOPINX</p>
    <h1>Miner Rush</h1>
    <h2>矿工冲冲冲</h2>
    <p>
      深入矿洞、收集装备并培养伙伴，在轻松放置中挑战更强的怪物。
      Miner Rush is a free-to-play Android game with optional ads and in-app purchases.
    </p>
    <nav aria-label="Support links">
      <a href="https://play.google.com/store/apps/details?id=com.gear.mr">Google Play</a>
      <a href="/miner-rush-privacy/">隐私政策 / Privacy</a>
      <a href="mailto:pangkunhong91@gmail.com">客服 / Support</a>
      <a href="/app-ads.txt">app-ads.txt</a>
    </nav>
    <footer>© 2026 ISHOPINX</footer>
  </main>
</body>
</html>
